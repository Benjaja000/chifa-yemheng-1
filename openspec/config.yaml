schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

context: |
  Project: sistema-restaurante — Gestión de chifa (reservas 3 canales, QR compartido,
  delivery, caja/facturación, auditoría). BD RESTAURANTEV3 (Supabase Postgres).
  Stack: React + TypeScript + Vite + TailwindCSS + React Router + Hook Form + TanStack Query
  / Express + TypeScript MVC (routes/controllers/services/repositories/models/middlewares)
  + Zod. Flow: React → Express API (/api/v1) → Supabase Postgres. Google Stitch: solo diseño.
  BD (intocable): PKs integer-identity (id_* GENERATED AS IDENTITY, NO UUID);
  snake_case; auditoría usucre/pccre/feccre/usumod/pcmod/fecmod + estado A/I/E (NO created_at/deleted_at).
  Auth propio: personal USP_LOGIN sha256 + bloqueo 3 intentos (BR-ACC-035);
  cliente Gmail OAuth → CLIENTE (BR-ACC-044); RBAC por tablas ROL/PERMISO (BR-ACC-036).
  Roles (8): admin, gerente, supervisor, cajero, mozo, cocinero, repartidor, cliente.
  Módulos (7): seguridad, mesas-atencion, cocina, caja-ventas, delivery, catalogos-admin, zona-cliente.
  Reglas madre: BR-RES-052 (reserva online P sin mesa), BR-ACC-055 (NC solo supervisor),
  BR-DER-030 (pago único), BR-RES-015 (anular solo no-facturado).
  GPS opcional con fallback manual (BR-GPS-001/002). Seed permisos: openspec/database/permiso_modulo.sql.
  Prohibido: UUID, Supabase Auth, created_at/deleted_at, reglas paralelas sin código BR-* del catálogo
  (openspec/docs/REGLAS_DE_NEGOCIO.md). Prohibido hardcodear datos de negocio en backend/frontend/BD/UI.
  Lista no exhaustiva de lo PROHIBIDO hardcodear (todo debe venir de BD/Supabase o de un endpoint):
  precios de productos, costos de envío/tarifas por distrito, porcentajes (IGV, cargo servicio, recargo por km),
  distritos/zonas, horarios de atención, teléfonos, textos de negocio, listas fijas y fallbacks inventados.
  Si falta el dato: devolver 0/[]/null con estado vacío en UI, nunca inventar (skeletons visuales sí permitidos).
  Toda cifra o parámetro de negocio debe ser parametrizable (tabla/columna/config) y declarar su origen.
  Convenciones: carpetas/archivos kebab-case,
  clases/componentes/interfaces PascalCase, vars/funcs camelCase, consts UPPER_SNAKE_CASE,
  TS strict + noAny. Detalle largo: openspec/docs/general/00-stack-tecnologico.md.

# Per-artifact rules (optional)
rules:
  proposal:
    - Toda cifra, tarifa, porcentaje, distrito u horario citado debe indicar su origen (tabla/campo/endpoint); prohibido dejar valores literales sin fuente.
    - Incluir sección "Non-goals" y la lista de BR-* afectados.
  design:
    - Documentar los parámetros de negocio como datos configurables (tabla/columna/config), no como constantes en código.
  tasks:
    - Incluir siempre una tarea de verificación por grep de hardcode (cifras, nombres, pcts, distritos, horarios) en las rutas/archivos afectados.
    - Cada tarea de cifra debe citar su fuente (tabla/campo/endpoint).

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
